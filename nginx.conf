worker_processes 1;
events {
    worker_connections 1024;
}
http {
    include mime.types;
    default_type application/octet-stream;

    # Ensure that these are included
    sendfile on;
    error_log /var/log/nginx/error.log debug;
    
    # Production server (port 443)
    server {
        listen 80;
        server_name 62.60.213.13;
        # Serve static files for the React app
        # Serve static files for the React app
        location ^~ /media/ {
            alias /app/media/;
            try_files $uri $uri/ =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|eot|ttf|otf)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000";
        }

        # React routes fallback to index.html
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }
        
        # Production API - Backend at 62.60.213.13
        location /api/ {
            proxy_pass http://62.60.213.13:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
}
