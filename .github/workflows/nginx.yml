name: Docker Nginx CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  docker-build:
    runs-on: ubuntu-latest  # Specifies the OS for the job

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx (for building Docker images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Build the Docker image from the Dockerfile
      - name: Build Docker image
        run: |
          docker build -t nginx .

      # Step 4: Run the Nginx container
      - name: Run Docker container
        run: |
          docker run -d -p 80:80 --name nginx-container nginx

      # Step 5: Check if Nginx is running properly
      - name: Verify Nginx is running
        run: |
          curl -f http://localhost:80 || exit 1

      # Step 6: Clean up by stopping and removing the container
      - name: Cleanup
        run: |
          docker stop nginx-container
          docker rm nginx-container
